<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JobHub — Find Your Dream Job</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- R2-10 demo: stands in for a real analytics/ad snippet. The browser
         never executes a script whose type it does not recognise, so this is
         inert until src/consentGate.ts activates it - which only happens once
         "analytics" consent actually exists (see initConsentGate() in
         main.tsx). This is what the K-48 periodic scan (scanForUngatedTags in
         consentGate.ts) checks for. -->
    <script type="text/plain" data-consent-category="analytics">
      window.__consent360DemoAnalyticsFired = (window.__consent360DemoAnalyticsFired || 0) + 1;
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
